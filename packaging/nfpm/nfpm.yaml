name: mechanix-dialer
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Yogita Hiray <yogita.hiray@mechasystem.com>"
description: Mechanix Dialer application
homepage: https://github.com/mecha-org/mechanix-dialer.git
license: BSD

overrides:
  rpm:
    depends:
      - mechanix-flutter-engine = 3.47.0
  deb:
    depends:
      - "mechanix-flutter-engine (= 3.47.0)"

contents:
  - src: ./stage/bundle/mechanix_dialer
    dst: /usr/share/mechanix/mechanix-dialer/mechanix_dialer
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib/libapp.so
    dst: /usr/share/mechanix/mechanix-dialer/lib/libapp.so
  - src: ./stage/bundle/lib/libobjectbox.so
    dst: /usr/share/mechanix/mechanix-dialer/lib/libobjectbox.so
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-dialer/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_dialer
    file_info:
      mode: 0755
  - src: ./org.mechanix.dialer.desktop
    dst: /usr/share/applications/org.mechanix.dialer.desktop
  - src: ./assets/desktop_icon.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.mechanix.dialer.png

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
